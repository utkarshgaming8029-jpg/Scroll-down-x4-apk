name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Firebase google-services.json
        run: |
          # If secret FIREBASE_GOOGLE_SERVICES_JSON is defined, use it
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
            echo "Loaded google-services.json from GitHub Secrets"
          elif [ ! -f android/app/google-services.json ]; then
            cp android/google-services.json.example android/app/google-services.json
            echo "Using placeholder google-services.json for CI debug build"
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x android/gradlew || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Copy & Rename APK for Easy Identification
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/scrolldown-debug.apk
          ls -la release-artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrolldown-debug-apk
          path: release-artifacts/scrolldown-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK Download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'SCROLL DOWN Android Debug Build' }}
          body: |
            ### 📱 SCROLL DOWN - Native Android Debug APK
            - **Package ID**: `com.scrolldown.social`
            - **Theme**: Dark Purple Neon
            - **Framework**: Kotlin 2.2 • Jetpack Compose • Material 3
            - **Commit**: `${{ github.sha }}`

            #### 📥 Download:
            Download the `scrolldown-debug.apk` file attached below and install it directly on your Android device or emulator.
          files: release-artifacts/scrolldown-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
